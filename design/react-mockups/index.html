<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentiBoard — Copernicus Sentinel Operations Dashboard</title>
    <meta name="description" content="Real-time Copernicus Sentinel ground-segment operations dashboard." />

    <script>
      // Dark-only mode: always set dark before first paint. Clear any stored choice so
      // an old "light" value cannot flash on reload. Re-enable the ThemeToggle in Nav.tsx
      // and restore the original body of this script to bring the toggle back.
      (function () {
        try { localStorage.removeItem("sb-theme"); } catch (e) {}
        document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
