sonar.projectName=sentiboard-backend
sonar.projectKey=sentiboard-backend

sonar.scm.provider=git

sonar.python.version=3.11

# The scan runs from the repository root (python-ci.yml); the reports produced by `tox`
# (tox.ini [testenv]) are downloaded into the project directory.
sonar.python.coverage.reportPaths=sentiboard-backend/coverage.xml
sonar.python.xunit.reportPaths=sentiboard-backend/pytest-report.xml

sonar.sources=sentiboard-backend
sonar.tests=sentiboard-backend/tests
sonar.exclusions=sentiboard-backend/tests/**,sentiboard-backend/index_templates/**,sentiboard-backend/migrate_*.py
sonar.coverage.exclusions=sentiboard-backend/tests/**
