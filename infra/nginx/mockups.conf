# Serves the built React mockups (design/react-mockups → dist/) as static files.
#
# The mockups are a react-router single-page app: only index.html exists on disk, and
# routes like /examples/about are resolved in the browser. Without the try_files
# fallback below, opening or refreshing any URL other than "/" returns 404 — which
# matters here because the two About layouts and the three index proposals are shared
# as deep links.
server {
    # 8080 matches the unprivileged nginx default and the port the existing SentiBoard
    # staging container publishes from.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so they can be cached hard.
    # This also covers the copied public/ assets (img/, mv/) which are not hashed —
    # they are versioned by deploy rather than by filename, so keep them shorter-lived.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, or a redeploy leaves clients on stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Everything else is an SPA route → hand it to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 20 MB hero video: allow range requests so the browser can seek/stream it.
    location /assets/mv/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
