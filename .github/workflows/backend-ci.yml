name: sentiboard-backend CI/CD

# Thin caller for the FastAPI backend, wired like maas-engine to the reusable building blocks
# of the workflow-catalog repo:
#   python-ci.yml     — test (pytest + SonarQube) -> build (wheel/sdist) -> publish to Nexus,
#                       every package through the Nexus PyPI group (nexus-context)
#   sbom.yml          — package CycloneDX SBOM -> Dependency-Track
#   docker-build.yml  — production image (sentiboard-backend/Dockerfile.prod) from the built
#                       wheel, dependencies through the same Nexus group, pushed to Nexus
#
# Triggers:
#   push to develop   -> ci (Nexus dev) + package SBOM (dev) + dev image
#   push tag x.y.z    -> ci (Nexus prod) + package SBOM (prod) + release image (Nexus/GHCR/Docker Hub)
#   workflow_dispatch -> manual run
#
# The package lives in sentiboard-backend/, so project-dir points there. SonarQube is scanned
# from the repository root: see sonar-project.properties.

on:
  push:
    branches: ["develop"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "sentiboard-backend/**"
      - "sonar-project.properties"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Test, build the wheel/sdist, publish to Nexus. Exposes `version`.
  ci:
    permissions:
      contents: read
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/python-ci.yml@develop
    with:
      project-dir: sentiboard-backend
      python-version: "3.11"
    secrets: inherit

  # Package SBOM -> Dependency-Track project "sentiboard-backend".
  # Consumes the `dist` artifact built by ci. Prod Nexus context on release tags, dev otherwise.
  sbom:
    needs: ci
    permissions:
      contents: read
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/sbom.yml@develop
    with:
      project-dir: sentiboard-backend
      project-name: sentiboard-backend
      project-version: ${{ needs.ci.outputs.version }}
      python-version: "3.11"
      context: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    secrets: inherit

  docker:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/docker-build.yml@develop
    with:
      image-name: sentiboard-backend
      context: sentiboard-backend
      dockerfile: sentiboard-backend/Dockerfile.prod
      # The image installs the wheel ci built (and published to Nexus), not the source tree.
      artifact-name: dist
      artifact-path: sentiboard-backend/dist/
      # The `pip_index_url` + `netrc` build secrets: the wheel's dependencies resolve through the
      # Nexus PyPI group of the same context ci installed from (a RUN step has no internet egress).
      mount-pip-index: true
      release: ${{ startsWith(github.ref, 'refs/tags/') }}
      push-to-ghcr: ${{ startsWith(github.ref, 'refs/tags/') }}
      push-to-dockerhub: ${{ startsWith(github.ref, 'refs/tags/') }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
      scan-dockerfile: true
      scan-dockerfile-soft-fail: true
      # The dev Docker connector is plain HTTP (see workflow-catalog python-demo.yml).
      insecure-registry: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # Image SBOM, release only (the package SBOM is the `sbom` job above).
      generate-sbom: ${{ startsWith(github.ref, 'refs/tags/') }}
      sbom-project-name: sentiboard-backend-image
      sbom-project-version: ${{ needs.ci.outputs.version }}
    secrets: inherit
