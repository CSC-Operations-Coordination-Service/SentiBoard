# Tox configuration file, driven by the workflow-catalog python-ci.yml / sbom.yml
# (same layout as maas-engine).
[tox]
minversion = 3.24
envlist = default
isolated_build = True


[testenv:.pkg]
# Forward setuptools_scm vars (e.g. SETUPTOOLS_SCM_PRETEND_VERSION*) into the
# isolated package-build env, where the version is actually computed.
passenv =
    SETUPTOOLS_*


[testenv]
description = Invoke pytest to run automated tests
setenv =
    TOXINIDIR = {toxinidir}
passenv =
    HOME
    SETUPTOOLS_*
extras =
    testing
commands =
    pytest \
        --cov \
        --junitxml=pytest-report.xml \
        --cov-report=xml:coverage.xml {posargs}


[testenv:{build,clean}]
description =
    build: Build the package in isolation according to PEP517, see https://github.com/pypa/build
    clean: Remove old distribution files and temporary build artifacts (./build and ./dist)
skip_install = True
changedir = {toxinidir}
deps =
    build: build[virtualenv]
passenv =
    SETUPTOOLS_*
commands =
    clean: python -c 'import shutil; [shutil.rmtree(p, True) for p in ("build", "dist")]'
    clean: python -c 'import pathlib, shutil; [shutil.rmtree(p, True) for p in pathlib.Path(".").glob("*.egg-info")]'
    build: python -m build {posargs}


[testenv:sbom]
description =
    Generate a CycloneDX SBOM for an installed package environment.
    Pass the path to a virtualenv that already has the package installed as
    posargs so resolved runtime deps are captured: `tox -e sbom -- .sbom-venv`.
    Output: sbom-python.cdx.json (CycloneDX JSON).
skip_install = True
changedir = {toxinidir}
deps = cyclonedx-bom
commands =
    cyclonedx-py environment {posargs} --output-format JSON --output-file sbom-python.cdx.json


[testenv:publish]
description =
    Publish the package to a package index server (the Nexus repository set by TWINE_*).
skip_install = True
changedir = {toxinidir}
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_REPOSITORY
    TWINE_REPOSITORY_URL
deps = twine
commands =
    python -m twine check dist/*
    python -m twine upload {posargs:--repository {env:TWINE_REPOSITORY:testpypi}} dist/*
