[metadata]
name = sentiboard-backend
description = SentiBoard API (FastAPI + OpenSearch)
author = Serco - Space
author_email = dev-eof@coordination-service.eu
license = Apache-2.0
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8
url = https://github.com/CSC-Operations-Coordination-Service/SentiBoard
platforms = Linux
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 3.11
    Framework :: FastAPI

[options]
zip_safe = False
include_package_data = True
python_requires = >=3.11
# The API is flat (main.py next to routers/, schemas/, ...), not a src layout.
py_modules =
    main
    setup_indices
    migrate_legacy
    migrate_processors
packages = find_namespace:
install_requires =
    maas-model[api]>=3.3.0,<4
    uvicorn>=0.30
    # bson reader for the Config Tools Mongo dump (migrate_processors.py)
    pymongo>=4.6

[options.packages.find]
include =
    routers*
    schemas*
    documents*
    index_templates*

[options.package_data]
# setup_indices.py reads these relative to its own location.
index_templates = *.json

# Resolved from the Nexus PyPI index (see .github/workflows/backend-ci.yml).
# maas-model brings opensearch-py; [api] adds pydantic + fastapi. The lower bound is
# the release the generated schemas import from (ApiList); requirements.txt pins it exactly.
[options.extras_require]
testing =
    pytest
    pytest-cov
    httpx
