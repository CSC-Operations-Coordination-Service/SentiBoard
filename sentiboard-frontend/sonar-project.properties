sonar.projectName=sentiboard-frontend
sonar.projectKey=sentiboard-frontend

sonar.scm.provider=git

# The scan's base directory is this one (node-workflow.yml, sonar-project-dir), so every path
# below is relative to sentiboard-frontend/. `pnpm test:coverage` writes the lcov report.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/__fixtures__/**,src/lib/api/schema.d.ts,src/styles/**
sonar.coverage.exclusions=src/**/*.test.ts,src/**/__fixtures__/**,src/lib/api/schema.d.ts,src/styles/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
